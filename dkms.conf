PACKAGE_NAME="bt-l2cap-encrypt-fix"
PACKAGE_VERSION="1.0.0"

# Downloads net/bluetooth/ for ${kernelver}, applies patches/*.patch and
# builds bluetooth.ko against the installed kernel-devel headers.
MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir}"

BUILT_MODULE_NAME[0]="bluetooth"
BUILT_MODULE_LOCATION[0]="src/net/bluetooth/"
DEST_MODULE_LOCATION[0]="/kernel/net/bluetooth/"

# Rebuild automatically for every new kernel installed with dnf.
AUTOINSTALL="yes"
